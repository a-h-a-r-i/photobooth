version: "3.9"

services:
  photobooth:
    build: .
    ports:
      - "8888:80"
      - "8443:443"
    environment:
      - COMPOSER_VERSION=2
    volumes:
      - ./photos:/app/data/images
      - ./thumbs:/app/data/thumbs
      - ./config:/app/config
      - ./src:/app/src
      - ./private:/app/private
